<!doctype html>
<!--
  Mẫu ảnh preview khi chia sẻ link (public/og-image.png, 1200×630).
  Đổi tên/chức danh ở dưới rồi chụp lại bằng lệnh trong README.
-->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif;
        color: #1d2733;
        background: #fff;
      }
      .card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 64px;
        height: 100%;
        padding: 0 88px;
        border-bottom: 18px solid #12507a;
      }
      .label {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #2f7fb5;
      }
      h1 {
        margin-top: 22px;
        font-size: 76px;
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .title {
        margin-top: 20px;
        font-size: 30px;
        font-weight: 500;
        color: #12507a;
      }
      .tagline {
        margin-top: 26px;
        max-width: 640px;
        font-size: 26px;
        line-height: 1.5;
        color: #51606f;
      }
      img {
        flex: none;
        width: 300px;
        height: 300px;
        border-radius: 50%;
        object-fit: cover;
        outline: 2px solid #e1e8ee;
        outline-offset: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <div class="label">Portfolio</div>
        <h1>Nguyễn Trọng Phong</h1>
        <div class="title">Fullstack Developer · Node.js / Vue.js / MySQL</div>
        <div class="tagline">Hơn 2 năm xây dựng web app quản lý nội bộ cho khách hàng Nhật Bản.</div>
      </div>
      <img src="../public/avatar.jpg" alt="" />
    </div>
  </body>
</html>
